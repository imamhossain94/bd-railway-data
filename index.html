<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Railway Open Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; /* Emerald 600 */
            --primary-light: #10b981; /* Emerald 500 */
            --primary-dark: #047857; /* Emerald 700 */
            --bg-color: #f8fafc; /* Slate 50 */
            --card-bg: #ffffff;
            --text-main: #0f172a; /* Slate 900 */
            --text-muted: #64748b; /* Slate 500 */
            --border-color: #e2e8f0; /* Slate 200 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 0.5rem;
            --radius-lg: 1rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .header-subtitle {
            font-size: 1.125rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        main {
            max-width: 1200px;
            margin: -2rem auto 4rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        .stats-container {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            min-width: 200px;
            border: 1px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            transform: translateY(0);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 3rem;
            font-size: 1.125rem;
            border: 2px solid transparent;
            border-radius: 9999px;
            background: var(--card-bg);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            font-family: inherit;
            color: var(--text-main);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 1.25rem;
            height: 1.25rem;
        }

        .train-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .train-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .train-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: var(--primary-light);
        }

        .train-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to right, rgba(16, 185, 129, 0.05), transparent);
            position: relative;
        }
        
        .train-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .train-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .train-code {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .train-body {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .route-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .route-info::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 20%;
            right: 20%;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--border-color) 0, var(--border-color) 4px, transparent 4px, transparent 8px);
            z-index: 1;
        }

        .station {
            text-align: center;
            background: var(--card-bg);
            z-index: 2;
            padding: 0 0.5rem;
        }

        .station-time {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .station-name {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .train-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .meta-value {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }
        
        .classes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }
        
        .class-pill {
            font-size: 0.7rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            color: var(--text-muted);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.5rem;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: var(--border-color);
            color: var(--text-main);
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
        }

        .stoppages-timeline {
            position: relative;
            padding-left: 2rem;
        }

        .stoppages-timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            bottom: 0.5rem;
            width: 2px;
            background: var(--border-color);
        }

        .stop-item {
            position: relative;
            margin-bottom: 1.5rem;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .stop-item::before {
            content: '';
            position: absolute;
            left: -1.85rem;
            top: 1.25rem;
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--primary);
        }

        .stop-item:last-child {
            margin-bottom: 0;
        }

        .stop-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .stop-name {
            font-weight: 600;
            font-size: 1.125rem;
        }

        .stop-times {
            display: flex;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .stop-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }
        
        .fares-table-container {
            margin-top: 2rem;
            overflow-x: auto;
        }
        
        .fares-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        
        .fares-table th, .fares-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        .fares-table th {
            background: var(--bg-color);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        
        .fares-table tbody tr:hover {
            background-color: var(--bg-color);
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            width: 100%;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
        
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bangladesh Railway Data</h1>
        <p class="header-subtitle">Open-source intercity train schedules, stoppages, and fares</p>
    </header>

    <main>
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="stat-trains">-</div>
                <div class="stat-label">Intercity Trains</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-stations">-</div>
                <div class="stat-label">Stations</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">v2.0</div>
                <div class="stat-label">Dataset Version</div>
            </div>
        </div>

        <div class="search-bar">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search trains by name, code, or station...">
        </div>

        <div id="loader" class="loader">
            <div class="spinner"></div>
        </div>

        <div id="trainGrid" class="train-grid hidden">
            <!-- Train cards will be injected here -->
        </div>
    </main>

    <!-- Modal for Train Details -->
    <div id="trainModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modalTitle" class="modal-title">Train Details</h2>
                    <p id="modalSubtitle" style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Route Info</p>
                </div>
                <button class="close-btn" id="closeModal">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body">
                <h3 style="margin-bottom: 1rem; font-size: 1.125rem; font-weight: 600;">Stoppages & Schedule</h3>
                <div id="modalTimeline" class="stoppages-timeline">
                    <!-- Stoppages will be injected here -->
                </div>
                
                <h3 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.125rem; font-weight: 600;">Fare Information (BDT)</h3>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">Fares shown are from origin station.</p>
                <div id="modalFares" class="fares-table-container">
                    <!-- Fares table will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let trainsData = [];
        let stationsMap = new Map();

        const formatClass = (cls) => {
            const map = {
                'shovon': 'Shovon',
                'shovon_chair': 'S. Chair',
                'snigdha': 'Snigdha',
                'ac_seat': 'AC Seat',
                'ac_berth': 'AC Berth'
            };
            return map[cls] || cls;
        };

        async function init() {
            try {
                // Fetch data
                const [trainsRes, stationsRes] = await Promise.all([
                    fetch('railway-data.json'),
                    fetch('railway-stations.json')
                ]);
                
                const trainsJson = await trainsRes.json();
                const stationsJson = await stationsRes.json();
                
                trainsData = trainsJson.trains;
                
                // Build stations map
                stationsJson.forEach(st => {
                    stationsMap.set(st.code, st);
                });

                // Update stats
                document.getElementById('stat-trains').textContent = trainsData.length;
                document.getElementById('stat-stations').textContent = stationsMap.size;

                // Render grid
                renderGrid(trainsData);
                
                // Hide loader, show grid
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('trainGrid').classList.remove('hidden');

                // Setup search
                document.getElementById('searchInput').addEventListener('input', handleSearch);
                
                // Setup modal close
                document.getElementById('closeModal').addEventListener('click', closeModal);
                document.getElementById('trainModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('trainModal')) closeModal();
                });
                
                // Escape key to close modal
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                });

            } catch (error) {
                console.error("Failed to load data:", error);
                document.getElementById('loader').innerHTML = `<p style="color: red;">Failed to load data. Please ensure you are running a local server.</p>`;
            }
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const filtered = trainsData.filter(t => 
                t.name.en.toLowerCase().includes(query) ||
                t.code.toLowerCase().includes(query) ||
                t.origin.name.en.toLowerCase().includes(query) ||
                t.destination.name.en.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        }

        function renderGrid(trains) {
            const grid = document.getElementById('trainGrid');
            grid.innerHTML = '';
            
            if (trains.length === 0) {
                grid.innerHTML = `<div class="no-results">
                    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto 1rem; opacity: 0.5;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h3>No trains found</h3>
                    <p>Try adjusting your search terms</p>
                </div>`;
                return;
            }

            trains.forEach((train, idx) => {
                const totalStops = train.stoppages.length;
                const distance = train.stoppages[totalStops - 1].distanceKm;
                
                const card = document.createElement('div');
                card.className = 'train-card';
                card.onclick = () => openModal(train);
                
                const classesHtml = train.classes.map(c => `<span class="class-pill">${formatClass(c)}</span>`).join('');
                
                card.innerHTML = `
                    <div class="train-header">
                        <div class="train-badge">${train.type}</div>
                        <div class="train-title">${train.name.en} <span class="train-code">#${train.code}</span></div>
                        <div class="classes-list">${classesHtml}</div>
                    </div>
                    <div class="train-body">
                        <div class="route-info">
                            <div class="station">
                                <div class="station-time">${train.departureTime}</div>
                                <div class="station-name">${train.origin.name.en}</div>
                            </div>
                            <div class="station">
                                <div class="station-time">${train.arrivalTime}</div>
                                <div class="station-name">${train.destination.name.en}</div>
                            </div>
                        </div>
                        <div class="train-meta">
                            <div class="meta-item">
                                <span class="meta-label">Distance</span>
                                <span class="meta-value">${distance} km</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Stops</span>
                                <span class="meta-value">${totalStops}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Off Day</span>
                                <span class="meta-value">${train.offDay.en || 'None'}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                // Staggered animation effect
                card.style.animationDelay = \`\${idx * 0.05}s\`;
                grid.appendChild(card);
            });
        }

        function openModal(train) {
            document.getElementById('modalTitle').textContent = \`\${train.name.en} (#\${train.code})\`;
            document.getElementById('modalSubtitle').textContent = \`\${train.origin.name.en} → \${train.destination.name.en} | Off Day: \${train.offDay.en || 'None'}\`;
            
            // Build Timeline
            const timeline = document.getElementById('modalTimeline');
            timeline.innerHTML = train.stoppages.map(stop => {
                const st = stationsMap.get(stop.stationCode);
                const stName = st ? st.name.en : stop.stationCode;
                const haltStr = stop.haltMinutes > 0 ? \`Halt: \${stop.haltMinutes}m\` : 'Origin/Dest';
                
                return \`
                    <div class="stop-item">
                        <div class="stop-header">
                            <div class="stop-name">\${stName}</div>
                            <div class="stop-times">Arr: \${stop.arrivalTime} | Dep: \${stop.departureTime}</div>
                        </div>
                        <div class="stop-meta">
                            <span>Dist: \${stop.distanceKm} km</span>
                            <span>\${haltStr}</span>
                        </div>
                    </div>
                \`;
            }).join('');
            
            // Build Fares Table
            const faresContainer = document.getElementById('modalFares');
            if (train.fares && Object.keys(train.fares).length > 0) {
                const fareStations = Object.keys(train.fares);
                
                let tableHtml = \`
                    <table class="fares-table">
                        <thead>
                            <tr>
                                <th>Destination</th>
                                \${train.classes.map(c => \`<th>\${formatClass(c)}</th>\`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                \`;
                
                fareStations.forEach(code => {
                    const st = stationsMap.get(code);
                    const stName = st ? st.name.en : code;
                    const fareObj = train.fares[code];
                    
                    tableHtml += \`<tr>
                        <td style="font-weight: 500;">\${stName}</td>
                        \${train.classes.map(c => \`<td>৳\${fareObj[c] || '-'}</td>\`).join('')}
                    </tr>\`;
                });
                
                tableHtml += \`</tbody></table>\`;
                faresContainer.innerHTML = tableHtml;
            } else {
                faresContainer.innerHTML = \`<p style="color: var(--text-muted); font-style: italic;">Detailed fare information not available for this train.</p>\`;
            }
            
            document.getElementById('trainModal').classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            document.getElementById('trainModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Railway Open Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            300: '#6ee7b7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for timeline and tables */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-br from-brand-700 to-brand-500 text-white py-16 px-6 text-center shadow-lg relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.1)_0%,transparent_60%)] pointer-events-none"></div>
        <div class="relative z-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Bangladesh Railway Data</h1>
            <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto font-light">Open-source intercity train schedules, stoppages, and fares</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-20 pb-16">
        
        <!-- Stats Row -->
        <div class="flex flex-wrap justify-center gap-6 mb-12">
            <div class="bg-white/90 backdrop-blur border border-white/50 p-6 rounded-2xl shadow-xl text-center min-w-[200px] transform hover:-translate-y-1 transition duration-300">
                <div class="text-4xl font-bold text-brand-600 mb-1" id="stat-trains">-</div>
                <div class="text-sm text-slate-500 uppercase tracking-wider font-semibold">Intercity Trains</div>
            </div>
            <div class="bg-white/90 backdrop-blur border border-white/50 p-6 rounded-2xl shadow-xl text-center min-w-[200px] transform hover:-translate-y-1 transition duration-300">
                <div class="text-4xl font-bold text-brand-600 mb-1" id="stat-stations">-</div>
                <div class="text-sm text-slate-500 uppercase tracking-wider font-semibold">Stations</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto mb-12 relative">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                <svg class="h-6 w-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="searchInput" class="w-full pl-14 pr-6 py-4 text-lg border-2 border-transparent bg-white shadow-md rounded-full focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-300 text-slate-800 placeholder-slate-400" placeholder="Search trains by name, code, or station...">
        </div>

        <!-- Initial Loader -->
        <div id="loader" class="flex justify-center items-center h-48">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-brand-500/20 border-t-brand-500"></div>
        </div>

        <!-- Train Grid -->
        <div id="trainGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Cards injected via JS -->
        </div>

    </main>

    <!-- Modal Overlay -->
    <div id="trainModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col transform scale-95 transition-transform duration-300" id="modalContent">
            
            <!-- Modal Header -->
            <div class="px-6 py-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <div>
                    <h2 id="modalTitle" class="text-2xl font-bold text-slate-800">Train Details</h2>
                    <p id="modalSubtitle" class="text-sm font-medium text-slate-500 mt-1">Route Info</p>
                </div>
                <button id="closeModal" class="text-slate-400 hover:text-slate-700 hover:bg-slate-200 p-2 rounded-full transition duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white rounded-b-2xl">
                
                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Stoppages & Schedule
                </h3>
                
                <!-- Timeline container -->
                <div class="relative pl-6 ml-2 border-l-2 border-brand-200" id="modalTimeline">
                    <!-- Timeline injected here -->
                </div>

                <h3 class="text-xl font-bold text-slate-800 mt-12 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    Fare Information (BDT)
                </h3>
                <p class="text-sm text-slate-500 mb-4 ml-7">Fares shown are calculated from the origin station.</p>
                
                <div class="overflow-x-auto custom-scrollbar rounded-xl border border-slate-200 ml-7 shadow-sm" id="modalFares">
                    <!-- Table injected here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let trainsData = [];
        let stationsMap = new Map();

        // Helper to format seat classes nicely
        const formatClass = (cls) => {
            const map = {
                'shovon': 'Shovon',
                'shovon_chair': 'S. Chair',
                'snigdha': 'Snigdha',
                'ac_seat': 'AC Seat',
                'ac_berth': 'AC Berth'
            };
            return map[cls] || cls;
        };

        const formatTime = (timeStr) => {
            if (!timeStr) return '';
            let [h, m] = timeStr.split(':');
            h = parseInt(h);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        };

        // Main Initialization
        async function init() {
            try {
                // Fetch the static JSON data
                const [trainsRes, stationsRes] = await Promise.all([
                    fetch('railway-data.json'),
                    fetch('railway-stations.json')
                ]);
                
                const trainsJson = await trainsRes.json();
                const stationsJson = await stationsRes.json();
                
                trainsData = trainsJson.trains;
                
                // Map stations by code for quick O(1) lookups
                stationsJson.forEach(st => stationsMap.set(st.code, st));

                // Update the statistic cards
                document.getElementById('stat-trains').textContent = trainsData.length;
                document.getElementById('stat-stations').textContent = stationsMap.size;

                // Render the initial grid of all trains
                renderGrid(trainsData);
                
                // Hide loader and show the grid
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('trainGrid').classList.remove('hidden');

                // Search input event listener
                document.getElementById('searchInput').addEventListener('input', handleSearch);
                
                // Modal close event listeners
                const modal = document.getElementById('trainModal');
                const modalContent = document.getElementById('modalContent');
                
                document.getElementById('closeModal').addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (!modalContent.contains(e.target)) closeModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                });

            } catch (error) {
                console.error("Failed to load data:", error);
                document.getElementById('loader').innerHTML = 
                    `<p class="text-red-500 font-medium bg-red-50 px-4 py-3 rounded-lg border border-red-200">
                        Failed to load data. Please ensure you are running this page on a local web server (not directly from file://).
                    </p>`;
            }
        }

        // Handles the search filtering
        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const filtered = trainsData.filter(t => 
                t.name.en.toLowerCase().includes(query) ||
                t.code.toLowerCase().includes(query) ||
                t.origin.name.en.toLowerCase().includes(query) ||
                t.destination.name.en.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        }

        // Renders the main train cards
        function renderGrid(trains) {
            const grid = document.getElementById('trainGrid');
            
            if (trains.length === 0) {
                grid.innerHTML = `
                <div class="col-span-full text-center py-16 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                    <svg class="mx-auto h-12 w-12 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h3 class="text-lg font-semibold text-slate-900">No trains found</h3>
                    <p class="text-slate-500 mt-1">Try adjusting your search terms</p>
                </div>`;
                return;
            }

            const html = trains.map((train, idx) => {
                const totalStops = train.stoppages.length;
                const distance = train.stoppages[totalStops - 1].distanceKm;
                
                // Map the classes to small pill UI elements
                const classesHtml = train.classes.map(c => 
                    `<span class="px-2 py-1 text-[10px] font-bold tracking-wide bg-slate-100 text-slate-600 rounded border border-slate-200">${formatClass(c)}</span>`
                ).join('');
                
                // We stringify the train object so we can pass it directly to the onclick handler
                const trainJson = JSON.stringify(train).replace(/"/g, '&quot;');
                
                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 hover:border-brand-300 transition-all duration-300 cursor-pointer flex flex-col group" onclick="openModalWithData(this)" data-train="${trainJson}">
                        
                        <div class="p-6 border-b border-slate-100 bg-gradient-to-r from-brand-50/50 to-transparent relative">
                            <span class="absolute top-6 right-6 bg-brand-100 text-brand-700 px-3 py-1 rounded-full text-xs font-bold tracking-wider group-hover:bg-brand-500 group-hover:text-white transition-colors duration-300">${train.type}</span>
                            <div class="flex items-center gap-2 mb-2 pr-16">
                                <h3 class="text-xl font-bold text-slate-800">${train.name.en}</h3>
                            </div>
                            <div class="text-sm font-semibold text-slate-400 mb-3">Train #${train.code}</div>
                            <div class="flex flex-wrap gap-1.5">${classesHtml}</div>
                        </div>

                        <div class="p-6 flex-grow flex flex-col">
                            
                            <!-- Visual Route Connection -->
                            <div class="flex justify-between items-center mb-8 relative">
                                <div class="absolute top-1/2 left-[25%] right-[25%] h-[2px] bg-[repeating-linear-gradient(90deg,var(--tw-colors-slate-200)_0,var(--tw-colors-slate-200)_6px,transparent_6px,transparent_12px)] -z-10"></div>
                                
                                <div class="text-center bg-white pr-3">
                                    <div class="text-xl font-bold text-slate-800">${formatTime(train.departureTime)}</div>
                                    <div class="text-sm font-medium text-slate-500 mt-1 max-w-[100px] truncate" title="${train.origin.name.en}">${train.origin.name.en}</div>
                                </div>
                                <div class="text-center bg-white pl-3">
                                    <div class="text-xl font-bold text-slate-800">${formatTime(train.arrivalTime)}</div>
                                    <div class="text-sm font-medium text-slate-500 mt-1 max-w-[100px] truncate" title="${train.destination.name.en}">${train.destination.name.en}</div>
                                </div>
                            </div>

                            <!-- Footer Meta Stats -->
                            <div class="grid grid-cols-2 gap-4 mt-auto pt-4 border-t border-dashed border-slate-200">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Distance</div>
                                    <div class="text-sm font-medium text-slate-700">${distance} km</div>
                                </div>
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Off Day</div>
                                    <div class="text-sm font-medium text-slate-700">${train.offDay.en || 'None'}</div>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            }).join('');
            
            grid.innerHTML = html;
        }

        // Expose openModal to window so onclick can call it
        window.openModalWithData = function(element) {
            const train = JSON.parse(element.getAttribute('data-train'));
            
            document.getElementById('modalTitle').textContent = `${train.name.en} (#${train.code})`;
            document.getElementById('modalSubtitle').textContent = `${train.origin.name.en} → ${train.destination.name.en} | Off Day: ${train.offDay.en || 'None'}`;
            
            // Build Stoppages Timeline
            const timelineHtml = train.stoppages.map((stop, idx) => {
                const st = stationsMap.get(stop.stationCode);
                const stName = st ? st.name.en : stop.stationCode;
                const haltStr = stop.haltMinutes > 0 ? `Halt: ${stop.haltMinutes}m` : 'End Station';
                const isOrigin = idx === 0;
                
                return `
                    <div class="relative mb-6 last:mb-0 bg-slate-50 p-4 rounded-xl border border-slate-100 shadow-sm">
                        <!-- Timeline Dot -->
                        <div class="absolute -left-[35px] top-5 w-[14px] h-[14px] rounded-full bg-white border-[3px] ${isOrigin ? 'border-blue-500' : 'border-brand-500'}"></div>
                        
                        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-3">
                            <div class="font-bold text-slate-800 text-lg">${stName}</div>
                            <div class="text-sm font-medium text-slate-600 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm flex gap-3">
                                <span>Arr: <strong class="text-slate-900">${formatTime(stop.arrivalTime)}</strong></span>
                                <span class="text-slate-300">|</span>
                                <span>Dep: <strong class="text-slate-900">${formatTime(stop.departureTime)}</strong></span>
                            </div>
                        </div>
                        
                        <div class="flex gap-5 text-sm font-medium text-slate-500">
                            <span class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg> 
                                ${stop.distanceKm} km
                            </span>
                            <span class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 
                                ${haltStr}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('modalTimeline').innerHTML = timelineHtml;
            
            // Build Fares Table
            const faresContainer = document.getElementById('modalFares');
            if (train.fares && Object.keys(train.fares).length > 0) {
                const fareStations = Object.keys(train.fares);
                
                const ths = train.classes.map(c => 
                    `<th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider border-b-2 border-slate-200 bg-slate-50 whitespace-nowrap">${formatClass(c)}</th>`
                ).join('');
                
                const trs = fareStations.map(code => {
                    const st = stationsMap.get(code);
                    const stName = st ? st.name.en : code;
                    const fareObj = train.fares[code];
                    
                    const tds = train.classes.map(c => 
                        `<td class="px-5 py-4 text-sm text-slate-600 border-b border-slate-100 font-medium whitespace-nowrap">
                            ${fareObj[c] ? '৳' + fareObj[c] : '<span class="text-slate-300">-</span>'}
                        </td>`
                    ).join('');
                    
                    return `<tr class="hover:bg-brand-50 transition-colors"><td class="px-5 py-4 text-sm font-bold text-slate-800 border-b border-slate-100 whitespace-nowrap">${stName}</td>${tds}</tr>`;
                }).join('');
                
                faresContainer.innerHTML = `
                    <table class="w-full text-left border-collapse">
                        <thead><tr><th class="px-5 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider border-b-2 border-slate-200 bg-slate-50 whitespace-nowrap">Destination</th>${ths}</tr></thead>
                        <tbody class="bg-white">${trs}</tbody>
                    </table>
                `;
            } else {
                faresContainer.innerHTML = `<div class="p-8 text-center text-slate-500 font-medium bg-slate-50">Detailed fare information is not available for this route.</div>`;
            }
            
            // Show modal
            const modal = document.getElementById('trainModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            document.body.style.overflow = 'hidden';
        }

        // Modal closer
        function closeModal() {
            const modal = document.getElementById('trainModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            document.body.style.overflow = '';
        }

        // Kickoff
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
